name: neurolearn_ai
description: AI-powered educational web platform built with Flutter Web.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  dio: ^5.7.0
  file_picker: ^8.1.7
  flutter_dropzone: ^4.2.0
  flutter_markdown: ^0.7.4+1
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  google_fonts: ^6.2.1
  lucide_icons_flutter: ^3.1.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
